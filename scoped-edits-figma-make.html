<title>Scoped Edits Prototype</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
/* Layout: a dark AI-tool workspace (chat left, live preview right) editing a light product hero. Single deliberate dark look. */
:root{
  color-scheme:dark;
  --app:#2C2C2C; --panel:#1E1E1E; --raised:#262626; --line:#3A3A3A; --ink:#E6E6E6; --mute:#9A9A9A;
  --blue:#0D99FF; --share:#0C8CE9; --purple:#0C8CE9; --green:#14AE5C; --amber:#F2A93B;
  --page:#F5F5F7; --pink:#1D1D1F; --pgmute:#6E6E73; --apple:#0071E3;
  --ui:"Inter",system-ui,-apple-system,"Segoe UI",sans-serif;
  --pg:-apple-system,BlinkMacSystemFont,"SF Pro Display","Helvetica Neue",Arial,sans-serif;
}
html,body{height:100%}
body{background:var(--app);color:var(--ink);font-family:var(--ui);font-size:14px;margin:0;overflow:hidden}
*,*::before,*::after{box-sizing:border-box}
button{font:inherit;color:inherit;cursor:pointer}
:focus-visible{outline:2px solid var(--blue);outline-offset:2px}
.app{height:100%;display:grid;grid-template-rows:48px 1fr;padding-left:env(safe-area-inset-left,0px);padding-right:env(safe-area-inset-right,0px)}

/* Top bar */
.top{display:flex;align-items:center;gap:14px;padding:0 14px;background:var(--panel);border-bottom:1px solid var(--line);min-width:0}
.glyph{width:22px;height:22px;border-radius:6px;background:conic-gradient(from 210deg,#0C8CE9,#14AE5C,#F2A93B,#F24822,#0C8CE9)}
.fname{font-weight:600;white-space:nowrap}
.fname span{color:var(--mute);margin-left:4px}
.ai{font-size:11px;border:1px solid var(--line);border-radius:5px;padding:1px 5px;color:var(--mute)}
.tabs{display:flex;gap:4px;margin-left:12px}
.tab{background:none;border:0;padding:6px 10px;border-radius:6px;color:var(--mute)}
.tab.on{background:var(--raised);color:var(--ink)}
.spacer{flex:1}
.avatar{width:26px;height:26px;border-radius:50%;background:#F4A86B;color:#3a230f;font-size:11px;font-weight:700;display:grid;place-items:center}
.ghost{background:none;border:1px solid var(--line);border-radius:7px;padding:6px 12px}
.solid{background:var(--share);border:0;border-radius:7px;padding:7px 14px;font-weight:600;color:#fff}
.icon-btn{background:none;border:0;color:var(--mute);padding:6px;border-radius:6px;display:grid;place-items:center}
.icon-btn:hover{background:var(--raised);color:var(--ink)}

.main{display:grid;grid-template-columns:400px minmax(0,1fr);min-height:0}

/* Chat */
.chat{background:var(--panel);border-right:1px solid var(--line);display:flex;flex-direction:column;min-height:0}
.chat-head{display:flex;align-items:center;gap:8px;padding:12px 14px;border-bottom:1px solid var(--line);font-weight:600}
.chat-head .spacer{flex:1}
.msgs{flex:1;overflow-y:auto;padding:16px 14px;display:flex;flex-direction:column;gap:12px;scroll-behavior:smooth}
.u{align-self:flex-end;max-width:85%;background:var(--raised);border:1px solid var(--line);border-radius:14px 14px 4px 14px;padding:10px 12px;line-height:1.45}
.a{line-height:1.5;max-width:100%}
.card{border:1px solid var(--line);border-radius:10px;background:var(--raised);padding:10px 12px;display:grid;gap:6px}
.row{display:flex;align-items:center;gap:8px;justify-content:space-between}
.small{font-size:12.5px;color:var(--mute)}
.mini{font-size:12px;border:1px solid var(--line);background:var(--panel);border-radius:6px;padding:3px 9px}
.mini:hover{border-color:var(--mute)}
.plus{color:var(--green)} .minus{color:#F24822}
.dot{width:7px;height:7px;border-radius:50%;display:inline-block;margin-right:7px;flex:none}
.cp{display:flex;align-items:center;justify-content:space-between;gap:8px;border:1px solid var(--line);border-radius:10px;padding:9px 12px;background:var(--panel)}
.cp b{font-weight:600;display:block}
.cp .t{color:var(--mute);font-size:12px}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chip{border:1px solid var(--line);background:var(--panel);border-radius:999px;padding:6px 12px;font-size:13px}
.chip.rec{border-color:var(--purple);color:#8FCBFF}
.chip.sel{background:var(--purple);border-color:var(--purple);color:#fff}
.chip:disabled{cursor:default;opacity:.8}
.thumbs{display:flex;gap:10px;color:#6b6b6b;font-size:13px}
.think{display:flex;align-items:center;gap:8px;color:var(--mute);font-size:13px}
.spin{width:12px;height:12px;border:2px solid var(--line);border-top-color:var(--purple);border-radius:50%;animation:sp .7s linear infinite}
@keyframes sp{to{transform:rotate(360deg)}}
.warn{border-left:3px solid var(--amber)}
.nudge{border:1px dashed var(--purple);border-radius:10px;padding:10px 12px;display:grid;gap:8px;background:rgba(12,140,233,.08)}
.btn-p{background:var(--purple);border:0;border-radius:7px;padding:6px 12px;color:#fff;font-weight:600;font-size:13px;justify-self:start}
.untouched{display:none;margin:2px 0 0 14px;padding-left:12px;color:var(--mute);font-size:12.5px}
.untouched.open{display:block}
.link{background:none;border:0;padding:0;color:var(--mute);font-size:12.5px;text-decoration:underline}

.composer{padding:10px 12px 12px;border-top:1px solid var(--line);display:grid;gap:8px}
.scope{display:none;align-items:center;gap:6px;justify-self:start;border:1px solid var(--purple);color:#8FCBFF;border-radius:999px;padding:4px 10px;font-size:12.5px}
.scope.on{display:inline-flex}
.box{border:1px solid var(--line);border-radius:12px;background:var(--raised);padding:10px 10px 8px;display:grid;gap:6px}
.box.ready{border-color:var(--purple);box-shadow:0 0 0 3px rgba(12,140,233,.18)}
#prompt{width:100%;min-height:58px;resize:none;background:none;border:0;color:var(--ink);font:inherit;line-height:1.45;cursor:pointer;outline:none}
#prompt::placeholder{color:#777}
.box-row{display:flex;align-items:center;gap:8px}
.build{font-size:12.5px;color:var(--mute)}
.send{margin-left:auto;width:30px;height:30px;border-radius:50%;border:0;background:#555;color:#fff;display:grid;place-items:center}
.send.on{background:var(--ink);color:#111}

/* Preview */
.preview{display:grid;grid-template-rows:44px 1fr;min-width:0;min-height:0}
.ptool{display:flex;align-items:center;gap:6px;padding:0 12px;border-bottom:1px solid var(--line);background:var(--panel)}
.url{color:var(--mute);margin-left:6px}
.editbtn{display:flex;align-items:center;gap:6px;background:none;border:1px solid transparent;border-radius:7px;padding:5px 10px}
.editbtn.on{border-color:var(--purple);color:#8FCBFF;background:rgba(12,140,233,.12)}
.canvas{position:relative;overflow:auto;padding:28px;display:flex;align-items:flex-start;justify-content:center}
.frame{width:min(900px,100%);background:var(--page);border-radius:14px;overflow:hidden;box-shadow:0 20px 50px rgba(0,0,0,.45);position:relative}
.frame-bar{height:30px;background:#E8E8ED;display:flex;align-items:center;gap:6px;padding:0 12px}
.frame-bar i{width:10px;height:10px;border-radius:50%;background:#c9c9cf}
.lockbanner{display:none;background:var(--purple);color:#fff;font-size:13px;font-weight:500;padding:7px 14px}
.lock-mode .lockbanner{display:block}
.hero{padding:56px 24px 0;display:flex;flex-direction:column;align-items:center;text-align:center;gap:6px;font-family:var(--pg);color:var(--pink)}

.el{position:relative;border-radius:6px;padding:2px 8px;transition:font-size .35s ease,outline-color .2s}
.el .tag{display:none;position:absolute;left:0;top:-24px;background:var(--blue);color:#fff;font:600 11px var(--ui);padding:3px 7px;border-radius:5px;white-space:nowrap;align-items:center;gap:5px;z-index:3}
.el .badge{display:none;position:absolute;right:-10px;top:-10px;width:20px;height:20px;border-radius:50%;background:#3A3A3A;color:#fff;place-items:center;z-index:3}
.el.locked .badge{display:grid}
.el .pill{display:none;position:absolute;right:-6px;top:-22px;background:var(--purple);color:#fff;font:600 10.5px var(--ui);padding:2px 7px;border-radius:999px;z-index:3}
.lock-mode .el{cursor:pointer}
.lock-mode .el:hover{outline:2px solid var(--blue);outline-offset:3px}
.lock-mode .el:hover .tag{display:flex}
.lock-mode .el.locked:hover::after{content:"";position:absolute;inset:0;border-radius:6px;background:repeating-linear-gradient(45deg,rgba(58,58,58,.10) 0 6px,transparent 6px 12px)}
.lock-mode .el.locked:hover .tag{background:#3A3A3A}
.lock-mode .el.editable,.el.editable.show{outline:2px solid var(--purple);outline-offset:3px}
.el.editable.show .pill,.lock-mode .el.editable .pill{display:block}
.badge.pulse{animation:pulse .9s ease 2}
@keyframes pulse{50%{transform:scale(1.35);background:var(--purple)}}

#headline{font-size:56px;font-weight:600;letter-spacing:-.02em;line-height:1.08;margin:0}
#headline.big{font-size:64px}
#subtitle{font-size:28px;font-weight:400;margin:0;min-height:36px}
#subtitle .w{display:inline-block;margin:0 .14em}
#subtitle.dissolve .w{opacity:0;filter:blur(8px);animation:dis .6s ease forwards}
@keyframes dis{to{opacity:1;filter:blur(0)}}
.replay{position:absolute;right:-34px;top:50%;transform:translateY(-50%);width:24px;height:24px;border-radius:50%;border:1px solid #d2d2d7;background:#fff;color:var(--pgmute);display:none;place-items:center}
.replay.on{display:grid}
#availability{font-size:17px;color:var(--pgmute);margin:6px 0 0}
.actions{display:flex;gap:14px;justify-content:center;margin-top:16px;min-height:0;border-radius:10px;padding:4px}
.actions.flash{outline:2px dashed var(--purple);outline-offset:6px}
.actions .el{padding:0}
.btn-a{display:inline-block;font:400 17px var(--pg);border-radius:980px;padding:11px 22px;line-height:1.2}
.btn-a.primary{background:var(--apple);color:#fff;border:1px solid var(--apple)}
.btn-a.outline{background:transparent;color:var(--apple);border:1px solid var(--apple)}
.enter{animation:enter .35s ease-out both}
@keyframes enter{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}
#image{margin:34px 0 0;padding:0}
.speaker{width:230px;height:250px;border-radius:44% 44% 40% 40%/30% 30% 24% 24%;background:
  radial-gradient(circle at 50% 18%,#fafafa 0 16%,transparent 17%),
  radial-gradient(#c7c7cc 1px,transparent 1.6px) 0 0/9px 9px,
  linear-gradient(180deg,#ececf0,#cfcfd6);box-shadow:inset 0 -20px 40px rgba(0,0,0,.08),0 24px 30px -18px rgba(0,0,0,.35)}
.floor{height:40px}
.device{display:block;width:560px;max-width:100%;height:auto;mix-blend-mode:multiply}

/* Elements panel */
.panel{display:none;position:absolute;top:16px;right:16px;width:250px;background:var(--panel);border:1px solid var(--line);border-radius:12px;box-shadow:0 14px 34px rgba(0,0,0,.5);z-index:5;overflow:hidden}
.lock-mode .panel{display:block}
.panel h3{margin:0;font-size:13px;font-weight:600;padding:12px 14px 8px}
.panel .acts{display:flex;gap:6px;padding:0 14px 10px}
.prow{display:flex;align-items:center;justify-content:space-between;padding:8px 14px;border-top:1px solid var(--line);font-size:13px}
.tg{width:34px;height:20px;border-radius:999px;border:0;background:#4a4a4a;position:relative;padding:0}
.tg::after{content:"";position:absolute;top:3px;left:3px;width:14px;height:14px;border-radius:50%;background:#fff;transition:transform .15s}
.tg.on{background:var(--purple)}
.tg.on::after{transform:translateX(14px)}
.panel .done{margin:10px 14px 14px;width:calc(100% - 28px);background:var(--ink);color:#111;border:0;border-radius:7px;padding:7px;font-weight:600}

/* Demo guide */
[hidden]{display:none!important}
.guide{position:fixed;right:calc(16px + env(safe-area-inset-right,0px));bottom:calc(16px + env(safe-area-inset-bottom,0px));z-index:20;background:#111;border:1px solid var(--line);border-radius:14px;padding:10px 12px;display:grid;gap:8px;width:290px;box-shadow:0 12px 30px rgba(0,0,0,.5)}
.guide .st{font-size:11px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;color:#8FCBFF}
.guide .hint{font-size:13px;line-height:1.4}
.guide .gb{display:flex;gap:6px}
.guide .gb button{flex:1;border:1px solid var(--line);background:var(--raised);border-radius:7px;padding:6px}
.guide .gb .nx{background:var(--purple);border-color:var(--purple);color:#fff;font-weight:600}
.guide .gb button:disabled{opacity:.4;cursor:default}
.guide .min{position:absolute;top:6px;right:8px;background:none;border:0;color:var(--mute);font-size:16px}
.guide.collapsed .hint,.guide.collapsed .gb{display:none}

@media (max-width:900px){
  body{overflow:auto}
  .app{height:auto;min-height:100%}
  .main{grid-template-columns:1fr}
  .chat{border-right:0;border-bottom:1px solid var(--line);height:60vh}
  .tabs,.ghost,.top .icon-btn{display:none}
  .canvas{padding:16px}
  #headline{font-size:40px} #headline.big{font-size:46px} #subtitle{font-size:22px}
  .panel{position:static;width:auto;margin:12px}
  .replay{right:-28px}
}
@media (prefers-reduced-motion:reduce){*{animation-duration:.01ms!important;transition:none!important}}
</style>

<div class="app">
  <header class="top">
    <div class="glyph" aria-hidden="true"></div>
    <div class="fname">Product Launch Page<span>⌄</span></div>
    <span class="ai">AI</span>
    <nav class="tabs"><button class="tab on">Browser</button><button class="tab">Files</button></nav>
    <div class="spacer"></div>
    <div class="avatar" aria-label="You">AR</div>

    <button class="icon-btn" aria-label="Present"><svg width="16" height="16" viewBox="0 0 24 24" fill="currentColor"><path d="M7 4l13 8-13 8z"/></svg></button>

    <button class="solid">Share</button>

  <div class="main">

      <div class="chat-head">Create interactive prototype<span class="spacer"></span>

            <button class="icon-btn" aria-label="Attach">+</button>
            <span class="build">Build ⌄</span>
            <button class="send" id="send" aria-label="Send">↑</button>
          </div>
        </div>
      </div>
    </section>

<script>
const $=s=>document.querySelector(s);
const LOCK='<svg width="11" height="11" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6"><rect x="5" y="11" width="14" height="10" rx="2"/><path d="M8 11V7a4 4 0 0 1 8 0v4"/></svg>';
const LABELS={headline:"Headline",subtitle:"Subtitle",availability:"Availability",learn:"Learn more",preorder:"Pre-order",image:"Product image"};
const P1="Add two buttons below 'Available starting 10.23': a blue 'Learn more' primary button and a 'Pre-order' outline button, left to right.";
const P2="Change the subtitle to 'Hello, hello.' and add a dissolve animation so each word fades in.";
const P3="Make the headline bigger.";
let S, busy=false;
class Abort extends Error{}

function fresh(){return {step:0,gen:(S?S.gen:0)+1,locks:{},hasButtons:false,sub:"Designed for life at home.",subAnim:false,big:false,lockMode:false}}
function ids(){return ["headline","subtitle","availability",...(S.hasButtons?["learn","preorder"]:[]),"image"]}
function lockedCount(){return ids().filter(i=>S.locks[i]).length}
async function wait(ms,fast){const g=S.gen;if(!fast)await new Promise(r=>setTimeout(r,ms));if(g!==S.gen)throw new Abort()}
function time(m){const d=new Date(2026,9,18,17,m);return d.toLocaleTimeString([], {hour:"numeric",minute:"2-digit"})}

/* ---------- chat builders ---------- */
const msgs=$("#msgs");
function add(html,cls){const d=document.createElement("div");if(cls)d.className=cls;d.innerHTML=html;msgs.appendChild(d);msgs.scrollTop=msgs.scrollHeight;return d}
const TH='<svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M7 10v11H3V10zM7 10l4-8a3 3 0 0 1 3 3v4h5a2 2 0 0 1 2 2.3l-1.4 8A2 2 0 0 1 17.6 21H7"/></svg>';
const thumbs=`<div class="thumbs" aria-hidden="true">${TH}<span style="display:inline-block;transform:scaleY(-1)">${TH}</span></div>`;
function checkpoint(label,m,step){return add(`<div><b>${label}</b><span class="t">${time(m)}</span></div><button class="mini" data-restore="${step}">Restore</button>`,"cp")}
async function thinking(text,ms,fast){if(fast)return;const t=add(`<span class="spin"></span>${text}`,"think");await wait(ms,false);t.remove()}
async function typePrompt(text,fast){const p=$("#prompt");$("#box").classList.remove("ready");if(fast){p.value=text;}else{p.value="";for(let i=1;i<=text.length;i+=2){p.value=text.slice(0,i);await wait(18,false)}p.value=text}$("#send").classList.add("on")}
function sendUser(text){add(text,"u");$("#prompt").value="";$("#send").classList.remove("on")}
function setScope(t){$("#scope").classList.toggle("on",!!t);$("#scopeTxt").textContent=t||""}

function history(){
  add("Create a landing hero for our new foldable phone.","u");
  add("Done. I created a hero with a headline, subtitle, availability date and product image.","a");
  add('<div class="row"><span>Edited 1 file <span class="plus">+42</span></span><button class="mini">Review</button></div>',"card");
  checkpoint("Create hero section",2,0); add(thumbs);
}

/* ---------- preview render ---------- */
function render(opts={}){
  document.body.classList.toggle("lock-mode",S.lockMode);
  $("#canvas").classList.toggle("lock-mode",S.lockMode);
  $("#editBtn").classList.toggle("on",S.lockMode);
  const act=$("#actions");
  if(S.hasButtons&&!act.children.length){
    act.innerHTML=`<div class="el" data-id="learn"><span class="btn-a primary">Learn more</span></div><div class="el" data-id="preorder"><span class="btn-a outline">Pre-order</span></div>`;
    if(opts.enter)act.querySelectorAll(".el").forEach((e,i)=>{e.classList.add("enter");e.style.animationDelay=i*90+"ms"});
  }
  if(!S.hasButtons)act.innerHTML="";
  const sub=$("#subtitle");
  if(opts.subAnim||sub.dataset.t!==S.sub){
    sub.dataset.t=S.sub;sub.classList.remove("dissolve");
    sub.innerHTML=S.sub.split(" ").map((w,i)=>`<span class="w" style="animation-delay:${i*350}ms">${w}</span>`).join("");
    if(S.subAnim){void sub.offsetWidth;sub.classList.add("dissolve")}
  }
  $("#replay").classList.toggle("on",S.subAnim);
  $("#headline").classList.toggle("big",S.big);
  const anyLock=lockedCount()>0;
  document.querySelectorAll(".el").forEach(el=>{
    const id=el.dataset.id;
    if(!el.querySelector(".tag"))el.insertAdjacentHTML("beforeend",`<span class="tag"></span><span class="badge">${LOCK}</span><span class="pill">Editable</span>`);
    const locked=!!S.locks[id];
    el.classList.toggle("locked",locked);
    el.classList.toggle("editable",anyLock&&!locked);
    el.querySelector(".tag").innerHTML=`${locked?LOCK:""}${LABELS[id]}${S.lockMode?(locked?" · locked":" · click to lock"):""}`;
  });
  $("#plist").innerHTML=ids().map(id=>`<div class="prow"><span>${LABELS[id]}</span><button class="tg ${S.locks[id]?"on":""}" data-tg="${id}" aria-label="Lock ${LABELS[id]}" aria-pressed="${!!S.locks[id]}"></button></div>`).join("");
}

/* ---------- warning card (locked element) ---------- */
function warnCard(label,applyFn){
  const c=add(`<div><b>The ${label} is locked, so I didn't change it.</b></div><div class="small">Unlock it to apply this edit, or keep it protected.</div><div class="chips"><button class="chip rec" data-w="apply">Unlock and apply</button><button class="chip" data-w="keep">Keep locked</button></div>`,"card warn");
  c.addEventListener("click",e=>{const b=e.target.closest("[data-w]");if(!b||c.dataset.done)return;c.dataset.done=1;
    c.querySelectorAll(".chip").forEach(x=>x.disabled=true);b.classList.add("sel");
    if(b.dataset.w==="keep"){add(`No changes made. The ${label.toLowerCase()} stays locked.`,"a")}else{applyFn()}
    updateGuide()});
}

/* ---------- scripted steps ---------- */
const STEPS=[
 {hint:"Click the prompt box to write a request.",run:f=>typePrompt(P1,f)},
 {hint:"Send the prompt.",run:async f=>{sendUser(P1);await thinking("Reading the page…",700,f);
   const c=add(`<div><b>Where should these buttons go?</b></div><div class="chips"><button class="chip rec" data-clar="hero">This hero only</button><button class="chip" data-clar="all">All product sections</button></div><div class="small">I'll only change what you pick. Everything else stays as it is.</div>`,"card");
   c.id="clar";}},
 {hint:"Choose “This hero only” to scope the edit.",run:async f=>{
   const c=$("#clar");if(c){c.querySelectorAll(".chip").forEach(x=>x.disabled=true);c.querySelector('[data-clar="hero"]').classList.add("sel")}
   setScope("Scope: Hero › Actions");
   await thinking("Editing Hero › Actions only…",1200,f);
   const act=$("#actions");if(!f)act.classList.add("flash");
   S.hasButtons=true;render({enter:!f});
   await wait(900,f);act.classList.remove("flash");
   add("Added 2 buttons below the availability line.","a");
   const r=add(`<div class="row"><span><span class="dot" style="background:var(--green)"></span>Changed: 1 area (Hero › Actions)</span><button class="mini">Review</button></div>
     <div><button class="link" data-untouched>Untouched: 4 elements</button><div class="untouched">Headline · Subtitle · Availability · Product image</div></div>`,"card");
   checkpoint("Add CTA buttons",12,3);add(thumbs);
   add(`<div>Happy with this? Lock finished parts so later edits can't change them.</div><button class="btn-p" data-lockstart>Lock elements</button>`,"nudge");}},
 {hint:"Click “Lock elements” (or Edit & lock) to enter lock mode.",run:async f=>{S.lockMode=true;render()}},
 {hint:"Lock everything except the subtitle. Next does it for you: Lock all, then unlock Subtitle.",run:async f=>{
   ids().forEach(i=>S.locks[i]=true);render();await wait(700,f);S.locks.subtitle=false;render()}},
 {hint:"Click Done to leave lock mode.",run:async f=>{S.lockMode=false;
   const n=lockedCount(),free=ids().filter(i=>!S.locks[i]).map(i=>LABELS[i]);
   setScope(`Scope: ${free.join(", ")||"nothing"} · ${n} locked`);render()}},
 {hint:"Click the prompt box to write the next request.",run:f=>typePrompt(P2,f)},
 {hint:"Send it. Only the unlocked subtitle should change.",run:async f=>{sendUser(P2);
   if(S.locks.subtitle){await thinking("Checking locks…",600,f);warnCard("Subtitle",()=>{S.locks.subtitle=false;applySub(false)});return}
   await thinking(`Editing Subtitle only · ${lockedCount()} elements locked…`,1300,f);
   applySub(f);}},
 {hint:"Now try changing something that's locked.",run:f=>typePrompt(P3,f)},
 {hint:"Send it and watch the lock protect the headline.",run:async f=>{sendUser(P3);await thinking("Checking locks…",700,f);
   if(!S.locks.headline){S.big=true;render();add("Increased the headline from 56px to 64px.","a");return}
   warnCard("Headline",()=>{S.locks.headline=false;S.big=true;render();add("Unlocked the headline and increased it from 56px to 64px.","a")})}}
];
function applySub(f){
  S.sub="Hello, hello.";S.subAnim=true;render({subAnim:true});
  if(!f)setTimeout(()=>document.querySelectorAll(".el.locked .badge").forEach(b=>{b.classList.remove("pulse");void b.offsetWidth;b.classList.add("pulse")}),900);
  add("Changed the subtitle to “Hello, hello.” with a word-by-word dissolve.","a");
  add(`<div><span class="dot" style="background:var(--green)"></span>Changed: Subtitle (text + dissolve animation)</div><div><span class="dot" style="background:var(--mute)"></span>Protected: ${lockedCount()} locked elements, untouched</div>`,"card");
  checkpoint("Animate subtitle",16,8);add(thumbs);
}

/* ---------- engine ---------- */
async function next(){if(busy||S.step>=STEPS.length)return;busy=true;
  try{await STEPS[S.step].run(false);S.step++}catch(e){if(!(e instanceof Abort))console.error(e)}
  busy=false;updateGuide()}
async function rebuild(n){S=fresh();busy=true;msgs.innerHTML="";$("#prompt").value="";$("#send").classList.remove("on");setScope("");
  $("#subtitle").dataset.t="";render();history();
  try{for(let i=0;i<n;i++){await STEPS[i].run(true);S.step=i+1}}catch(e){}
  busy=false;render();updateGuide()}
function updateGuide(){
  $("#box").classList.toggle("ready",[0,6,8].includes(S.step)&&!busy);
}

/* ---------- interactions ---------- */
$("#prompt").addEventListener("click",()=>{if([0,6,8].includes(S.step))next()});
$("#send").addEventListener("click",()=>{if([1,7,9].includes(S.step))next()});
$("#prompt").addEventListener("keydown",e=>{if(e.key==="Enter"){e.preventDefault();if([1,7,9].includes(S.step))next()}});
msgs.addEventListener("click",e=>{
  const r=e.target.closest("[data-restore]");if(r&&!busy){rebuild(+r.dataset.restore);return}
  const c=e.target.closest("[data-clar]");
  if(c&&S.step===2){if(c.dataset.clar==="hero")next();else if(!$("#clarnote"))add("For this demo, pick “This hero only”.","small").id="clarnote";return}
  if(e.target.closest("[data-lockstart]")&&S.step===3){next();return}
  const u=e.target.closest("[data-untouched]");if(u)u.nextElementSibling.classList.toggle("open");
});
$("#editBtn").addEventListener("click",()=>{if(busy)return;if(S.step===3){next();return}if(S.hasButtons){S.lockMode=!S.lockMode;render()}});
function toggleLock(id){S.locks[id]=!S.locks[id];render()}
document.querySelector(".hero").addEventListener("click",e=>{if(!S.lockMode)return;const el=e.target.closest(".el");if(el)toggleLock(el.dataset.id)});
$("#plist").addEventListener("click",e=>{const t=e.target.closest("[data-tg]");if(t)toggleLock(t.dataset.tg)});
$("#lockAll").addEventListener("click",()=>{ids().forEach(i=>S.locks[i]=true);render()});
$("#unlockAll").addEventListener("click",()=>{S.locks={};render()});
$("#doneBtn").addEventListener("click",()=>{if(busy)return;if(S.step===4){S.step=5}if(S.step===5){next()}else{S.lockMode=false;render()}});
$("#replay").addEventListener("click",()=>render({subAnim:true}));






$("#restart").addEventListener("click",()=>{if(!busy)rebuild(0)});
rebuild(0);
</script>
